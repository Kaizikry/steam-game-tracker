name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steamtracker
          POSTGRES_PASSWORD: steamtracker
          POSTGRES_DB: steamtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://steamtracker:steamtracker@localhost:5432/steamtracker_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
